<svg viewBox="0 0 512 512" width="512" height="512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="hwBg" cx="50%" cy="32%" r="80%">
      <stop offset="0%" stop-color="#1C3A28"/>
      <stop offset="55%" stop-color="#12271A"/>
      <stop offset="100%" stop-color="#081109"/>
    </radialGradient>
    <clipPath id="hwTile">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112"/>
    </clipPath>
  </defs>

  <!-- Rounded-square tile -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#hwBg)"/>

  <g clip-path="url(#hwTile)">

    <!-- Drying-air / breeze lines -->
    <g fill="none" stroke="#EEF4EE" stroke-width="5" stroke-linecap="round" opacity="0.42">
      <path d="M 96 150 q 18 -12 36 0 q 18 12 36 0"/>
      <path d="M 416 150 q -18 -12 -36 0 q -18 12 -36 0"/>
    </g>

    <!-- Sun (low, centered) -->
    <g stroke="#E8B23A" stroke-width="13" stroke-linecap="round">
      <line x1="316" y1="172" x2="338" y2="172"/>
      <line x1="298" y1="214" x2="314" y2="230"/>
      <line x1="256" y1="232" x2="256" y2="254"/>
      <line x1="214" y1="214" x2="198" y2="230"/>
      <line x1="196" y1="172" x2="174" y2="172"/>
      <line x1="214" y1="130" x2="198" y2="114"/>
      <line x1="256" y1="112" x2="256" y2="90"/>
      <line x1="298" y1="130" x2="314" y2="114"/>
    </g>
    <circle cx="256" cy="172" r="52" fill="#E8B23A"/>

    <!-- Ground line (mown field) -->
    <line x1="118" y1="415" x2="394" y2="415" stroke="#4BBF7A" stroke-width="4" stroke-linecap="round" opacity="0.25"/>

    <!-- Round hay bale -->
    <circle cx="256" cy="338" r="76" fill="#E8B23A"/>
    <circle cx="256" cy="338" r="50" fill="none" stroke="#EEF4EE" stroke-width="6" opacity="0.28"/>
    <circle cx="256" cy="338" r="24" fill="none" stroke="#EEF4EE" stroke-width="6" opacity="0.28"/>

    <!-- Foreground cut hay / grass tufts (symmetric) -->
    <g stroke-linecap="round" fill="none">
      <!-- left tuft -->
      <line x1="150" y1="414" x2="150" y2="384" stroke="#E8B23A" stroke-width="5"/>
      <line x1="150" y1="414" x2="132" y2="390" stroke="#4BBF7A" stroke-width="5"/>
      <line x1="150" y1="414" x2="168" y2="392" stroke="#4BBF7A" stroke-width="5"/>
      <line x1="150" y1="414" x2="142" y2="386" stroke="#EEF4EE" stroke-width="3" opacity="0.85"/>
      <!-- right tuft -->
      <line x1="362" y1="414" x2="362" y2="384" stroke="#E8B23A" stroke-width="5"/>
      <line x1="362" y1="414" x2="380" y2="390" stroke="#4BBF7A" stroke-width="5"/>
      <line x1="362" y1="414" x2="344" y2="392" stroke="#4BBF7A" stroke-width="5"/>
      <line x1="362" y1="414" x2="370" y2="386" stroke="#EEF4EE" stroke-width="3" opacity="0.85"/>
    </g>

  </g>
</svg>
